<main class="login-page">
  <section class="login-brand" aria-label="Identificação do sistema">
    <div class="brand-mark">
      <mat-icon aria-hidden="true">church</mat-icon>
    </div>
    <p class="brand-eyebrow">ADBrás Cosmópolis</p>
    <h1>SAAC</h1>
    <p class="brand-description">Sistema Administrativo da Secretaria</p>
  </section>

  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Acessar sua conta</mat-card-title>
      <mat-card-subtitle>Entre com suas credenciais</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-mail</mat-label>
          <mat-icon matPrefix>mail</mat-icon>
          <input
            matInput
            type="email"
            formControlName="email"
            autocomplete="username"
            placeholder="seu@email.com">
          <mat-error *ngIf="loginForm.controls.email.hasError('required')">
            Informe seu e-mail.
          </mat-error>
          <mat-error *ngIf="loginForm.controls.email.hasError('email')">
            Informe um e-mail válido.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            type="password"
            formControlName="senha"
            autocomplete="current-password">
          <mat-error *ngIf="loginForm.controls.senha.hasError('required')">
            Informe sua senha.
          </mat-error>
        </mat-form-field>

        <p class="login-error" *ngIf="erro" role="alert">{{ erro }}</p>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="submit-button"
          [disabled]="loginForm.invalid || carregando">
          <mat-spinner *ngIf="carregando" diameter="20"></mat-spinner>
          <span>{{ carregando ? 'Entrando...' : 'Entrar' }}</span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer>
      <span>Acesso restrito a usuários autorizados</span>
    </mat-card-footer>
  </mat-card>
</main>
