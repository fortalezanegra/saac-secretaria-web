<div class="dashboard-shell">
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav mode="side" opened class="sidenav">
      <a class="brand" routerLink="/" aria-label="Ir para o início">
        <span class="brand-icon"><mat-icon>church</mat-icon></span>
        <span>
          <strong>SAAC</strong>
          <small>Secretaria</small>
        </span>
      </a>

      <div class="user-summary" *ngIf="usuario() as user">
        <div class="avatar">{{ (user.nome || user.email).charAt(0).toUpperCase() }}</div>
        <div class="user-details">
          <strong>{{ user.nome || 'Usuário' }}</strong>
          <span>{{ user.email }}</span>
        </div>
      </div>

      <mat-nav-list class="navigation">
        <a
          mat-list-item
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Visão geral</span>
        </a>

        <ng-template #renderMenu let-items>
          <ng-container *ngFor="let item of items">
            <a
              *ngIf="item.rota; else menuGroup"
              mat-list-item
              [routerLink]="item.rota"
              routerLinkActive="active">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>

            <ng-template #menuGroup>
              <div class="menu-group">
                <div class="menu-group-title">
                  <mat-icon>{{ item.icon }}</mat-icon>
                  <span>{{ item.label }}</span>
                </div>

                <ng-container *ngIf="item.filhos?.length">
                  <ng-container
                    *ngTemplateOutlet="renderMenu; context: { $implicit: item.filhos }">
                  </ng-container>
                </ng-container>
              </div>
            </ng-template>
          </ng-container>
        </ng-template>

        <ng-container
          *ngTemplateOutlet="renderMenu; context: { $implicit: menuItems }">
        </ng-container>
      </mat-nav-list>

      <div class="sidenav-bottom">
        <button mat-button class="logout-button" type="button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </div>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <header class="page-header">
        <div>
          <span class="eyebrow">Painel administrativo</span>
          <h1>Secretaria</h1>
        </div>
        <div class="header-user" *ngIf="usuario() as user">
          <mat-icon>account_circle</mat-icon>
          <span>{{ user.nome || user.email }}</span>
        </div>
      </header>

      <main class="dashboard-content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
