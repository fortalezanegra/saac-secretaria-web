<main class="pagina">
  <header class="cabecalho">
    <p class="sobre-titulo">SECRETARIA</p>
    <h1>Cadastrar reunião ministerial</h1>
    <p class="descricao">Preencha os dados para registrar uma nova reunião.</p>
  </header>

  @if (mensagem) {
    <p class="aviso sucesso" role="status">{{ mensagem }}</p>
  }

  @if (erro) {
    <p class="aviso erro" role="alert">{{ erro }}</p>
  }

  <section class="cartao">
    <h2>Dados da reunião</h2>

    @if (carregandoOpcoes) {
      <p class="estado">Carregando congregações e situações…</p>
    }

    <form [formGroup]="formulario" (ngSubmit)="salvar()">
      <div class="campos">
        <label>
          Tipo de reunião
          <select formControlName="tipoReuniao">
            @for (tipo of tiposReuniao; track tipo.valor) {
              <option [value]="tipo.valor">{{ tipo.descricao }}</option>
            }
          </select>
        </label>

        <label>
          Congregação
          <select formControlName="congregacaoId">
            <option [ngValue]="0" disabled>Selecione uma congregação</option>
            @for (congregacao of congregacoes; track congregacao.congregacaoId) {
              <option [ngValue]="congregacao.congregacaoId">
                {{ congregacao.nome }}
              </option>
            }
          </select>
        </label>

        <label>
          Data da reunião
          <input type="date" formControlName="dataReuniao">
        </label>

        <label>
          Situação
          <select formControlName="situacaoId">
            <option [ngValue]="0" disabled>Selecione uma situação</option>
            @for (situacao of situacoes; track situacao.situacaoId) {
              <option [ngValue]="situacao.situacaoId">
                {{ situacao.descricao }}
              </option>
            }
          </select>
        </label>
      </div>

      <div class="acoes-formulario">
        <button
          class="botao primario"
          type="submit"
          [disabled]="salvando || carregandoOpcoes">
          {{ salvando ? 'Cadastrando…' : 'Cadastrar reunião' }}
        </button>

        <button
          class="botao secundario"
          type="button"
          (click)="limparFormulario()"
          [disabled]="salvando">
          Limpar
        </button>
      </div>
    </form>
  </section>
</main>
